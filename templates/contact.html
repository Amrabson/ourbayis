{% extends "base.html" %}
{% block title %}{{ t('contact_title') }} — {{ brand }}{% endblock %}
{% block content %}
<div class="wrap section auth-wrap">
  <div class="glass glass-panel">
    <h1 class="section-title">{{ t('contact_title') }}</h1>
    <p class="page-sub">{{ t('contact_sub') }}</p>
    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label>{{ t('your_name') }}<input name="name" maxlength="120"></label>
      <label>{{ t('email') }}<input name="email" type="email" maxlength="200"></label>
      <label>{{ t('topic') }}
        <select name="topic">
          {% for val in ['general', 'registry', 'shana', 'partner'] %}
          <option value="{{ val }}" {% if request.args.get('topic') == val %}selected{% endif %}>{{ t('topic_' ~ val) }}</option>
          {% endfor %}
        </select>
      </label>
      <label>{{ t('message_body') }} *<textarea name="body" rows="5" required maxlength="4000"></textarea></label>
      <button class="btn btn-primary btn-lg" type="submit">{{ t('send') }}</button>
    </form>
  </div>
</div>
{% endblock %}
