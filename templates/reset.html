{% extends "base.html" %}
{% block title %}{{ t('reset_title') }} — {{ brand }}{% endblock %}
{% block content %}
<div class="home sheet-page">
  <div class="sec-inner sheet-grid sheet-solo">
    <div class="sheet">
      <p class="kicker">{{ t('sheet_forgot_kicker') }}</p>
      <h1 class="sheet-title">{{ t('reset_title') }}</h1>
      <form method="post" class="stack-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>{{ t('password') }}<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
        <label>{{ t('password2') }}<input name="password2" type="password" required minlength="8" autocomplete="new-password"></label>
        <button class="btn btn-primary btn-lg btn-block" type="submit">{{ t('reset_btn') }}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block ad %}{% endblock %}
