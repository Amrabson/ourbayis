{% extends "base.html" %}
{% block title %}Catalog item — {{ brand }}{% endblock %}
{% block content %}
<div class="wrap section narrow admin">
  <div class="form-panel">
    <h1 class="section-title">{{ 'Edit' if row else 'New' }} catalog item</h1>
    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-2col">
        <label>Name (EN) *<input name="name" required maxlength="200" value="{{ row['name'] if row else '' }}"></label>
        <label dir="rtl">Name (HE)<input name="name_he" maxlength="200" value="{{ row['name_he'] if row else '' }}"></label>
        <label>Brand<input name="brand" maxlength="80" placeholder="e.g. Tefal, Vardinon…" value="{{ row['brand'] if row else '' }}"></label>
        <label>Category
          <select name="category">
            {% for slug, (icon, en, he) in categories.items() %}
            <option value="{{ slug }}" {% if row and row['category'] == slug %}selected{% endif %}>{{ en }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Price (₪)<input name="price_nis" type="number" min="0" value="{{ row['price_nis'] if row else '' }}"></label>
        <label>Store<input name="store" maxlength="120" value="{{ row['store'] if row else '' }}"></label>
        <label>Sort<input name="sort" type="number" value="{{ row['sort'] if row else 0 }}"></label>
      </div>
      <label>Affiliate / store URL<input name="url" maxlength="500" placeholder="https://…" value="{{ row['url'] if row else '' }}"></label>
      <label>Image URL (optional)<input name="image" maxlength="500" placeholder="https://…" value="{{ row['image'] if row else '' }}"></label>
      <label class="check-label"><input type="checkbox" name="active" {% if not row or row['active'] %}checked{% endif %}> Active</label>
      <label class="check-label"><input type="checkbox" name="featured" {% if row and row['featured'] %}checked{% endif %}> Featured on homepage</label>
      <button class="btn btn-primary btn-lg" type="submit">Save</button>
    </form>
  </div>
</div>
{% endblock %}
