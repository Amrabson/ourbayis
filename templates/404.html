{% extends "base.html" %}
{% block title %}{{ t('notfound_title') }} — {{ brand }}{% endblock %}
{% block content %}
<div class="wrap section narrow" style="text-align:center">
  <h1 class="section-title">{{ t('notfound_title') }}</h1>
  <p class="page-sub">{{ t('notfound_body') }}</p>
  <div class="hero-ctas" style="justify-content:center">
    <a class="btn btn-primary btn-lg" href="{{ url_for('index') }}">{{ t('back_home') }}</a>
    <a class="btn btn-ghost btn-lg" href="{{ url_for('catalog_page') }}">{{ t('nav_catalog') }}</a>
  </div>
  <form class="find-form err-find" method="get" action="{{ url_for('find') }}">
    <input type="search" name="q" placeholder="{{ t('find_placeholder') }}" aria-label="{{ t('notfound_search_label') }}">
    <button class="btn btn-primary" type="submit"><svg class="ic"><use href="#i-search"/></svg> {{ t('find_btn') }}</button>
  </form>
</div>
{% endblock %}
